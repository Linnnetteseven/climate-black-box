# Single entry point. The browser only ever sees this origin, so there is no
# CORS to configure and the API is never addressable on its own.

upstream cbb_web { server web:3000; }
upstream cbb_api { server api:8001; }

server {
    listen 80;
    server_name _;

    # Certbot's HTTP-01 challenge. Left in place so renewals work without
    # taking the site down.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Until a certificate exists this serves the site directly. After running
    # certbot, swap this block for a redirect to https.
    location /api/ {
        proxy_pass         http://cbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Verification shells out to the chain and can take a few seconds.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://cbb_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The imagery and audio are immutable and large; let browsers keep them.
    location ~* ^/(earth|scenery|evidence|audio)/ {
        proxy_pass      http://cbb_web;
        proxy_set_header Host $host;
        # Next sends max-age=0 for files in public/. add_header appends rather
        # than replaces, and two Cache-Control headers make browsers fall back
        # to the stricter one -- so drop Next's before setting ours.
        proxy_hide_header Cache-Control;
        add_header      Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8m;
}
