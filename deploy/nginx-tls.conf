# Swap this in for nginx.conf after certbot has issued a certificate:
#
#   cd ~/climate-black-box/deploy
#   sed -i 's|CBB_DOMAIN|yourdomain.com|g' nginx-tls.conf
#   echo 'CBB_NGINX_CONF=./nginx-tls.conf' >> .env
#   docker compose -f docker-compose.prod.yml up -d --force-recreate nginx

upstream cbb_web { server web:3000; }
upstream cbb_api { server api:8001; }

server {
    listen 80;
    server_name CBB_DOMAIN;

    # Renewals need this to stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name CBB_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/CBB_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CBB_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass         http://cbb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://cbb_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* ^/(earth|scenery|evidence|audio)/ {
        proxy_pass       http://cbb_web;
        proxy_set_header Host $host;
        # Next sends max-age=0 for files in public/. add_header appends rather
        # than replaces, and two Cache-Control headers make browsers fall back
        # to the stricter one -- so drop Next's before setting ours.
        proxy_hide_header Cache-Control;
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 8m;
}
